name: Rotate Apple Sign In Secret

on:
  schedule:
    # Apple client secret 最長 6 個月有效；每年 1/1、5/1、9/1 換新，任兩次間隔最多 4 個月
    - cron: '0 0 1 1,5,9 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 這個 repo 是公開的，log 任何人都看得到：腳本不會印出 token，失敗時 job 會變紅並寄信通知
      - name: Generate new secret and update Supabase
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_KEY_FILE }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: epyykzxxglkjombvozhr
        run: node scripts/rotate-apple-secret.cjs
