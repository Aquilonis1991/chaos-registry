<!doctype html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- 以 App 模式執行，減少瀏覽器感（PWA / 加到主畫面 / Capacitor） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ChaosRegistry" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1419" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="ChaosRegistry - 不理性登記處" />
  <meta property="og:description" content="最好玩的投票平台，用代幣投票，創造話題，贏取獎勵！" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.chaosregistry.com/logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://www.chaosregistry.com/logo.png" />

  <!-- 在 React 載入之前檢測 LINE 和 X (Twitter) OAuth 回調並轉發到 Edge Function -->
  <!-- 這可以避免 Supabase 的內建處理邏輯攔截回調 -->
  <script>
    (function() {
      // 檢查是否為 OAuth 回調（包括 /auth/callback 和 Supabase 的 /auth/v1/callback）
      const pathname = window.location.pathname;
      const isAuthCallback = pathname === '/auth/callback' || 
                            pathname.includes('/auth/callback') ||
                            pathname === '/auth/v1/callback' ||
                            pathname.includes('/auth/v1/callback');
      
      if (!isAuthCallback) {
        return;
      }
      
      console.log('[Pre-React] OAuth callback detected, pathname:', pathname);
      
      // 立即檢查 URL 參數
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      
      const code = urlParams.get('code') || hashParams.get('code');
      const state = urlParams.get('state') || hashParams.get('state');
      const error = urlParams.get('error') || hashParams.get('error');
      const provider = urlParams.get('provider') || hashParams.get('provider');
      const platform = urlParams.get('platform') || hashParams.get('platform');
      
      // 檢查是否為 magic link 回調（URL hash 中包含 access_token 和 refresh_token）
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      const type = hashParams.get('type');
      const deepLink = urlParams.get('deep_link'); // 從 URL 參數中提取 deep_link（Edge Function 傳遞的）
      
      // 優先處理：如果有 deep_link 參數且是 magic link 回調，立即重定向到 Deep Link
      // 這確保了在外部瀏覽器中也能正確返回 APP
      if (deepLink && type === 'magiclink' && accessToken && refreshToken) {
        console.log('[Pre-React] Deep link parameter detected, redirecting to Deep Link immediately');
        const deepLinkUrl = deepLink + '#access_token=' + encodeURIComponent(accessToken) + '&refresh_token=' + encodeURIComponent(refreshToken) + '&type=magiclink';
        console.log('[Pre-React] Redirecting to Deep Link:', deepLinkUrl);
        
        // 立即重定向到 Deep Link（在 React 載入之前）
        window.location.href = deepLinkUrl;
        return;
      }
      
      // 如果是 magic link 回調且在外部瀏覽器中，嘗試重定向到 Deep Link
      if (type === 'magiclink' && accessToken && refreshToken) {
        console.log('[Pre-React] Magic link callback detected in external browser, redirecting to Deep Link');
        
        // 檢查是否為移動設備
        const userAgent = navigator.userAgent || '';
        const isMobile = userAgent.includes('Mobile') || userAgent.includes('Android') || userAgent.includes('iPhone');
        
        // 如果有 platform=app 參數，或者是移動設備，重定向到 Deep Link
        if (platform === 'app' || isMobile) {
          const deepLinkUrl = 'votechaos://auth/callback#access_token=' + encodeURIComponent(accessToken) + '&refresh_token=' + encodeURIComponent(refreshToken) + '&type=magiclink';
          console.log('[Pre-React] Redirecting to Deep Link:', deepLinkUrl);
          
          // 立即重定向到 Deep Link（在 React 載入之前）
          window.location.href = deepLinkUrl;
          return;
        }
      }
      
      // 處理 LINE Provider：如果有 code 和 state，且沒有 Supabase 的 access_token，使用 fetch POST 請求調用 Edge Function
      // 注意：X (Twitter) 使用不同的處理方式（JWT state，可能可以通過重定向）
      if (code && state && !hashParams.get('access_token') && !urlParams.get('access_token')) {
        // 判斷是 LINE 還是 X (Twitter)
        // 如果 state 是 JWT 格式（X/Twitter），或者沒有明確的 provider 標記，優先判斷為 X (Twitter)
        const isTwitter = provider === 'twitter' || (!provider && state.includes('.'));
        const functionName = isTwitter ? 'twitter-auth' : 'line-auth';
        
        // 從當前 URL 推斷 Supabase URL（從 hostname 提取）
        // 或者使用默認值
        let supabaseUrl = 'https://epyykzxxglkjombvozhr.supabase.co';
        // Supabase Anon Key（公開的，用於客戶端）
        // 注意：這是公開的 Anon Key，用於客戶端調用 Edge Function
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVweXlrenh4Z2xram9tYnZvemhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MDg1MTEsImV4cCI6MjA3NTk4NDUxMX0.A2QBfDwW1TlG5GiKaHN3_JzT3Tk3U0hJfTZm0hRq1tg';
        try {
          // 嘗試從當前頁面的 hostname 推斷（如果是 Supabase 託管）
          const hostname = window.location.hostname;
          if (hostname.includes('supabase.co')) {
            const match = hostname.match(/([^.]+)\.supabase\.co/);
            if (match) {
              supabaseUrl = 'https://' + match[1] + '.supabase.co';
            }
          }
        } catch (e) {
          // 使用默認值
        }
        
        // 對於 LINE，使用 fetch POST 請求調用 Edge Function（避免 401 錯誤）
        if (functionName === 'line-auth') {
          const edgeFunctionUrl = supabaseUrl + '/functions/v1/' + functionName + '/callback';
          
          console.log('[Pre-React] LINE callback detected, calling Edge Function via fetch:', edgeFunctionUrl);
          
          // 使用 fetch POST 請求調用 Edge Function
          // 添加 apikey header 以避免 Supabase 路由層級攔截
          fetch(edgeFunctionUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': supabaseAnonKey,
              'Authorization': 'Bearer ' + supabaseAnonKey,
            },
            body: JSON.stringify({
              code: code,
              state: state,
              error: error || null,
            }),
          })
          .then(async (response) => {
            if (response.status >= 300 && response.status < 400) {
              // 重定向響應（Edge Function 返回 magic link）
              const redirectUrl = response.headers.get('location');
              if (redirectUrl) {
                console.log('[Pre-React] Edge Function returned redirect:', redirectUrl);
                window.location.href = redirectUrl;
                return;
              }
            } else if (response.ok) {
              const data = await response.json().catch(() => null);
              if (data?.redirectUrl) {
                window.location.href = data.redirectUrl;
                return;
              }
            }
            // 如果沒有重定向，讓 React 處理
            console.log('[Pre-React] Edge Function response:', response.status);
          })
          .catch((err) => {
            console.error('[Pre-React] Error calling Edge Function:', err);
            // 如果出錯，讓 React 處理
          });
          
          // 阻止後續處理
          return;
        } else {
          // 對於 X (Twitter)，也使用 fetch POST 請求調用 Edge Function（避免 401 錯誤）
          const edgeFunctionUrl = supabaseUrl + '/functions/v1/' + functionName + '/callback';
          
          console.log('[Pre-React] X (Twitter) callback detected, calling Edge Function via fetch:', edgeFunctionUrl);
          console.log('[Pre-React] Callback parameters:', { code: code ? 'present' : 'missing', state: state ? 'present' : 'missing', error: error || 'none' });
          
          // 使用 fetch POST 請求調用 Edge Function
          // 添加 apikey header 以避免 Supabase 路由層級攔截
          fetch(edgeFunctionUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': supabaseAnonKey,
              'Authorization': 'Bearer ' + supabaseAnonKey,
            },
            body: JSON.stringify({
              code: code,
              state: state,
              error: error || null,
            }),
          })
          .then(async (response) => {
            console.log('[Pre-React] Edge Function response status:', response.status);
            console.log('[Pre-React] Edge Function response headers:', Object.fromEntries(response.headers.entries()));
            
            if (response.status >= 300 && response.status < 400) {
              // 重定向響應（Edge Function 返回 magic link）
              const redirectUrl = response.headers.get('location');
              if (redirectUrl) {
                console.log('[Pre-React] Edge Function returned redirect:', redirectUrl);
                
                // 處理 magic link 或 Deep Link
                if (redirectUrl.startsWith('votechaos://')) {
                  console.log('[Pre-React] Deep Link detected, using window.location.href');
                  window.location.href = redirectUrl;
                } else if (redirectUrl.startsWith('http://') || redirectUrl.startsWith('https://')) {
                  try {
                    var urlObj = new URL(redirectUrl);
                    var redirectTo = urlObj.searchParams.get('redirect_to');
                    
                    if (redirectTo && redirectTo.startsWith('votechaos://')) {
                      console.log('[Pre-React] Magic link with Deep Link redirect_to detected, opening Deep Link directly:', redirectTo);
                      window.location.href = redirectTo;
                    } else {
                      console.log('[Pre-React] Opening URL:', redirectUrl);
                      window.location.href = redirectUrl;
                    }
                  } catch (e) {
                    console.error('[Pre-React] Failed to parse redirect URL:', e);
                    window.location.href = redirectUrl;
                  }
                } else {
                  window.location.href = redirectUrl;
                }
                return;
              }
            } else if (response.ok) {
              const data = await response.json().catch(() => null);
              console.log('[Pre-React] Edge Function response data:', data);
              if (data?.redirectUrl) {
                console.log('[Pre-React] Edge Function returned redirectUrl:', data.redirectUrl);
                
                // 處理 magic link 或 Deep Link
                if (data.redirectUrl.startsWith('votechaos://')) {
                  console.log('[Pre-React] Deep Link detected, using window.location.href');
                  window.location.href = data.redirectUrl;
                } else if (data.redirectUrl.startsWith('http://') || data.redirectUrl.startsWith('https://')) {
                  try {
                    var urlObj = new URL(data.redirectUrl);
                    var redirectTo = urlObj.searchParams.get('redirect_to');
                    
                    if (redirectTo && redirectTo.startsWith('votechaos://')) {
                      console.log('[Pre-React] Magic link with Deep Link redirect_to detected, opening Deep Link directly:', redirectTo);
                      window.location.href = redirectTo;
                    } else {
                      console.log('[Pre-React] Opening URL:', data.redirectUrl);
                      window.location.href = data.redirectUrl;
                    }
                  } catch (e) {
                    console.error('[Pre-React] Failed to parse redirect URL:', e);
                    window.location.href = data.redirectUrl;
                  }
                } else {
                  window.location.href = data.redirectUrl;
                }
                return;
              }
            }
            // 如果沒有重定向，讓 React 處理
            console.log('[Pre-React] Edge Function response:', response.status, 'No redirect URL found');
          })
          .catch((err) => {
            console.error('[Pre-React] Error calling Edge Function:', err);
            // 如果出錯，讓 React 處理
          });
          
          // 阻止後續處理
          return;
        }
      }
    })();
  </script>

  <!-- 減少 Web App 感的全域樣式（載入時即生效） -->
  <style>
    html {
      -webkit-text-size-adjust: 100%;
      overscroll-behavior: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;
    }
    body {
      background-color: #000;

      font-family: system-ui, -apple-system, sans-serif;
    }
    input, textarea, [contenteditable="true"] {
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
  <!-- Critical CSS for Loading Skeleton -->
  <style>
    #app-skeleton {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .skeleton-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(45deg, #333, #444);
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }

    .skeleton-bar {
      width: 200px;
      height: 6px;
      border-radius: 3px;
      background: #333;
      overflow: hidden;
      position: relative;
    }

    .skeleton-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: #666;
      animation: slide 1s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.6;
      }
    }

    @keyframes slide {
      0% {
        left: -50%;
      }

      100% {
        left: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="app-skeleton">
      <div class="skeleton-logo"></div>
      <div class="skeleton-bar"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
